<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1150" role="img" aria-label="02 · Внутри дорожки"><title>02 · Внутри дорожки</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9589" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f4f4ed"/><path d="M760.0 120V155.0H280.0V190" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M760.0 120V155.0H780.0V190" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M760.0 120V155.0H1280.0V190" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M280.0 275V307.5H280.0V340" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M280.0 435V465.0H280.0V495" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="280.0" y="457.0" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Переключить нижнюю вкладку</text><path d="M280.0 610V640.0H280.0V670" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M780.0 275V307.5H780.0V340" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M780.0 435V465.0H780.0V495" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="780.0" y="457.0" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Другой инструмент</text><path d="M780.0 590V620.0H780.0V650" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="780.0" y="612.0" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Другой инструмент</text><path d="M1280.0 275V307.5H1280.0V340" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M1280.0 435V465.0H1280.0V495" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1280.0" y="457.0" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Смена эффекта</text><path d="M1280.0 590V620.0H1280.0V650" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M280.0 800V855.0H780.0V910" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="530.0" y="847.0" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Нужны правила смены инструмента</text><g><rect x="540" y="45" width="440" height="75" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="558" y="73" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ДОРОЖКА</text><text x="558" y="98" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Имя · инструмент · собственный SPACE</text></g><g><rect x="50" y="190" width="460" height="85" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="218" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">PATTERN</text><text x="68" y="243" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">A–D · длина 16 / 64 · страницы по 16</text></g><g><rect x="550" y="190" width="460" height="85" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="568" y="218" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">VOICE</text><text x="568" y="243" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">ORGANISM / MONO / SAMPLER</text></g><g><rect x="1050" y="190" width="460" height="85" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1068" y="218" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">SPACE</text><text x="1068" y="243" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">ORBIT / POND · FX ON / BYPASS</text></g><g><rect x="50" y="340" width="460" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="368" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">STEP · четыре поля</text><text x="68" y="393" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Z: note · X: velocity</text><text x="68" y="414" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">C: gate · V: probability</text></g><g><rect x="50" y="495" width="460" height="115" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="523" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">LOCKS · те же кнопки</text><text x="68" y="548" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Четыре параметра текущего инструмента</text><text x="68" y="569" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">«—» наследует базовое значение</text><text x="68" y="590" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Первая стрелка назначает lock</text></g><g><rect x="50" y="670" width="460" height="130" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="698" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПАРАМЕТРЫ LOCKS</text><text x="68" y="723" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">ORGANISM: tension / drift / chaos / density</text><text x="68" y="744" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">MONO: cutoff / resonance / attack / release</text><text x="68" y="765" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">SAMPLER: pitch / speed / slice / level</text></g><g><rect x="550" y="340" width="460" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="568" y="368" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ORGANISM</text><text x="568" y="393" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Tension / drift / chaos / density</text><text x="568" y="414" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Preset · смена инструмента</text></g><g><rect x="550" y="495" width="460" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="568" y="523" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">MONO</text><text x="568" y="548" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Cutoff / resonance / attack / release</text><text x="568" y="569" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Preset · смена инструмента</text></g><g><rect x="550" y="650" width="460" height="100" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="568" y="678" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">SAMPLER</text><text x="568" y="703" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Pitch / speed / slices / slice</text><text x="568" y="724" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Память сэмплов · reverse · loop</text></g><g><rect x="1050" y="340" width="460" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1068" y="368" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ORBIT</text><text x="1068" y="393" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Time / feedback / mix / spread</text></g><g><rect x="1050" y="495" width="460" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1068" y="523" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">POND</text><text x="1068" y="548" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Size / decay / damping / mix</text></g><g><rect x="1050" y="650" width="460" height="115" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1068" y="678" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ОБЛАСТЬ ДЕЙСТВИЯ</text><text x="1068" y="703" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">SPACE меняет только эту дорожку</text><text x="1068" y="724" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">MASTER FX расположен в MIX</text><text x="1068" y="745" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">и обрабатывает общую сумму</text></g><g><rect x="50" y="910" width="1460" height="130" rx="3" fill="#f2e8e1" stroke="#b18d77" /><text x="68" y="938" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">УТОЧНИТЬ МОДЕЛЬ ПАТТЕРНОВ</text><text x="68" y="963" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Сейчас выбор A–D, копирование паттерна и длина общие для всех дорожек.</text><text x="68" y="984" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Кнопки находятся внутри дорожки: область действия необходимо явно показать.</text><text x="68" y="1005" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">После смены инструмента прежние locks остаются, но могут стать невидимыми.</text></g></svg>