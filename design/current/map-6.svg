<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-label="Циклы, длительность и FX LOCKS"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#85878c"/></marker></defs><rect width="1240" height="800" fill="#191a1c"/><path d="M620 165 V195 H220 V225" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M620 165 V195 H620 V225" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M220 355 V385 H220 V415" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M620 355 V385 H620 V415" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M1020 355 V385 H1020 V415" fill="none" stroke="#85878c" marker-end="url(#a)"/><rect x="440" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">Общий транспорт</text><text x="456" y="95" font-family="Arial" font-size="13" fill="#b9babf">BPM · шаг = 1/16 ноты</text><text x="456" y="118" font-family="Arial" font-size="13" fill="#b9babf">Непрерывный tick для всех дорожек</text><rect x="40" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">CYCLE / дорожка + A–D</text><text x="56" y="285" font-family="Arial" font-size="13" fill="#b9babf">Z + стрелки: 1–64 · пресеты 16/32/64</text><text x="56" y="308" font-family="Arial" font-size="13" fill="#b9babf">Позиция = tick % length</text><rect x="440" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">STEP / LENGTH</text><text x="456" y="285" font-family="Arial" font-size="13" fill="#b9babf">C + стрелки: 1–64 шага звучания</text><text x="456" y="308" font-family="Arial" font-size="13" fill="#b9babf">Для дрона: один триггер + LENGTH 16</text><rect x="840" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">FX LOCKS</text><text x="856" y="285" font-family="Arial" font-size="13" fill="#b9babf">4 актуальных поля ORBIT / POND / CRUSH</text><text x="856" y="308" font-family="Arial" font-size="13" fill="#b9babf">Смена FX сохраняет прежний набор локов</text><rect x="40" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">Страницы по 16</text><text x="56" y="475" font-family="Arial" font-size="13" fill="#b9babf">За границей цикла: недоступные клетки</text><text x="56" y="498" font-family="Arial" font-size="13" fill="#b9babf">Скрытые шаги сохраняются</text><rect x="440" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">Раздельные маркеры</text><text x="456" y="475" font-family="Arial" font-size="13" fill="#b9babf">Сверху: playhead · снизу: длина ноты</text><text x="456" y="498" font-family="Arial" font-size="13" fill="#b9babf">TRIG: заливка · LOCK: точка</text><rect x="840" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">Сохранение / сцены</text><text x="856" y="475" font-family="Arial" font-size="13" fill="#b9babf">Длины и локи входят в снимок</text><text x="856" y="498" font-family="Arial" font-size="13" fill="#b9babf">Master cycle задаёт очередь сцен</text></svg>