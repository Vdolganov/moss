<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1170" role="img" aria-label="02 · Клавиша — назначение сэмпла"><title>02 · Клавиша — назначение сэмпла</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9589" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f4f4ed"/><path d="M780.0 145V197.5H270.0V250" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="525.0" y="189.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Назначение 1</text><path d="M780.0 145V197.5H780.0V250" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="780.0" y="189.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Назначение 2</text><path d="M780.0 355V407.5H780.0V460" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="780.0" y="399.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Удержать кнопку + стрелки</text><path d="M1000 525.0H1035.0V525.0H1070" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M1290.0 590V665.0H1290.0V740" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><g><rect x="560" y="50" width="440" height="95" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="578" y="78" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ASSET · DRONE_01</text><text x="578" y="103" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Небольшой неизменяемый файл</text><text x="578" y="124" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Один PCM-буфер в кэше</text></g><g><rect x="50" y="250" width="440" height="105" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="278" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">C3 · DRONE_01</text><text x="68" y="303" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">PITCH 0 · START 0.00 s</text><text x="68" y="324" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">END 2.00 s · LEVEL 80%</text></g><g><rect x="560" y="250" width="440" height="105" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="578" y="278" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">D3 · DRONE_01</text><text x="578" y="303" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">PITCH −12 · START 0.40 s</text><text x="578" y="324" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">END 1.60 s · LEVEL 65%</text></g><g><rect x="1070" y="250" width="440" height="105" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1088" y="278" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">G3 · DUST_03</text><text x="1088" y="303" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Другой asset</text><text x="1088" y="324" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">PITCH +7 · диапазон 0.10–0.70 s</text></g><g><rect x="560" y="460" width="440" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="578" y="488" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ЧЕТЫРЕ ПАРАМЕТРА КЛАВИШИ</text><text x="578" y="513" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Z: PITCH · X: START · C: END · V: LEVEL</text><text x="578" y="534" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Редактирование не меняет исходный файл</text><text x="578" y="555" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">PLAY MODE: ONE SHOT / GATE / LOOP</text></g><g><rect x="50" y="460" width="440" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="488" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">VOICE · КАРТА 16 КЛАВИШ</text><text x="68" y="513" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Предложение: C3–D♯4, сетка 4×4</text><text x="68" y="534" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">D-pad выбирает и пустые клавиши</text><text x="68" y="555" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">A: назначить, заменить или снять назначение</text></g><g><rect x="1070" y="460" width="440" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1088" y="488" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">PATTERN · KEY</text><text x="1088" y="513" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Только доступные назначенные клавиши</text><text x="1088" y="534" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">C3 → D3 → G3</text><text x="1088" y="555" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Показывать ноту и имя сэмпла</text></g><g><rect x="1070" y="740" width="440" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1088" y="768" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">LOCKS ШАГА</text><text x="1088" y="793" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">PITCH / START / END / LEVEL</text><text x="1088" y="814" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">«—» наследует выбранную клавишу</text><text x="1088" y="835" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Lock действует только на один шаг</text></g><g><rect x="50" y="740" width="440" height="125" rx="3" fill="#f2e8e1" stroke="#b18d77" /><text x="68" y="768" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">EMPTY KIT</text><text x="68" y="793" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Нет назначенных клавиш</text><text x="68" y="814" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Нельзя включить ложный триггер</text><text x="68" y="835" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Переход в VOICE для назначения</text></g><g><rect x="560" y="740" width="440" height="125" rx="3" fill="#f2e8e1" stroke="#b18d77" /><text x="578" y="768" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">UNASSIGNED / MISSING FILE</text><text x="578" y="793" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Назначение удалено или файл отсутствует</text><text x="578" y="814" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Старый шаг сохраняет номер клавиши</text><text x="578" y="835" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Автоподстановки соседнего сэмпла нет</text></g><g><rect x="50" y="980" width="1460" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="1008" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">НОТА — АДРЕС НАЗНАЧЕНИЯ</text><text x="68" y="1033" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">C3 и D3 с одним asset и одинаковым PITCH воспроизводят одинаковую высоту.</text><text x="68" y="1054" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Высоту задаёт PITCH назначения; автоматическая хроматическая раскладка — отдельная будущая операция.</text><text x="68" y="1075" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">ONE SHOT проигрывает до END; GATE ограничивает длительность; LOOP повторяет диапазон до конца gate.</text></g></svg>