<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1170" role="img" aria-label="01 · TAPE → библиотека → SAMPLER"><title>01 · TAPE → библиотека → SAMPLER</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9589" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f4f4ed"/><path d="M270.0 165V225.0H780.0V285" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M780.0 165V225.0H780.0V285" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M1290.0 165V225.0H780.0V285" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M780.0 415V467.5H780.0V520" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="780.0" y="459.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Сохранить фрагменты</text><path d="M780.0 645V697.5H780.0V750" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="780.0" y="689.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Выбрать и назначить</text><path d="M1000 815.0H1035.0V815.0H1070" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1035.0" y="805.0" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">KEY</text><g><rect x="50" y="55" width="440" height="110" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="83" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">TAPE · RESAMPLE</text><text x="68" y="108" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Дорожка с SPACE или MASTER</text><text x="68" y="129" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Запись исходника на накопитель блоками</text></g><g><rect x="560" y="55" width="440" height="110" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="578" y="83" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">TAPE · IMPORT</text><text x="578" y="108" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Файл с накопителя устройства</text><text x="578" y="129" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Начать с PCM WAV; большой файл читать частями</text></g><g><rect x="1070" y="55" width="440" height="110" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1088" y="83" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">TAPE · LIBRARY</text><text x="1088" y="108" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Выбрать существующий материал</text><text x="1088" y="129" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Оригинал остаётся неизменным</text></g><g><rect x="560" y="285" width="440" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="578" y="313" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">TAPE · EDIT / SLICE</text><text x="578" y="338" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Диапазон · границы слайсов · fade in / out</text><text x="578" y="359" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Предпросмотр числа и размеров файлов</text><text x="578" y="380" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">SAVE SELECTED / SAVE ALL</text></g><g><rect x="560" y="520" width="440" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="578" y="548" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">БИБЛИОТЕКА НА SD</text><text x="578" y="573" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Самостоятельные короткие assets</text><text x="578" y="594" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">DRONE_01 · DRONE_02 · DUST_03</text><text x="578" y="615" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Общий каталог, стабильные ID</text></g><g><rect x="560" y="750" width="440" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="578" y="778" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">VOICE · SAMPLER</text><text x="578" y="803" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Назначить asset на клавишу</text><text x="578" y="824" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Свои pitch / start / end / level</text><text x="578" y="845" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Один asset можно назначить несколько раз</text></g><g><rect x="50" y="520" width="440" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="548" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">TAPE ГОТОВИТ МАТЕРИАЛ</text><text x="68" y="573" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Импорт · ресэмплинг · нарезка</text><text x="68" y="594" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Создаёт файлы для библиотеки</text><text x="68" y="615" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Не меняет ноты и инструмент дорожки</text></g><g><rect x="1070" y="520" width="440" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1088" y="548" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">RAM · ОГРАНИЧЕННЫЙ КЭШ</text><text x="1088" y="573" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Только нужные уникальные assets</text><text x="1088" y="594" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Назначения разделяют PCM-буфер</text><text x="1088" y="615" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Подготовка до наступления шага</text></g><g><rect x="1070" y="750" width="440" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1088" y="778" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">PATTERN · KEY ШАГА</text><text x="1088" y="803" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Выбор занятой клавиши SAMPLER</text><text x="1088" y="824" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Velocity · gate · probability</text><text x="1088" y="845" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">LOCKS: pitch / start / end / level</text></g><g><rect x="50" y="980" width="1460" height="130" rx="3" fill="#f2e8e1" stroke="#b18d77" /><text x="68" y="1008" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ТРИ РАЗНЫХ СОСТОЯНИЯ</text><text x="68" y="1033" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Файл есть на SD → файл назначен клавише → файл готов в RAM.</text><text x="68" y="1054" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Подрезка в SAMPLER меняет воспроизведение назначения. Физическое уменьшение файла выполняется в TAPE.</text><text x="68" y="1075" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">В этой итерации меняются модель и схемы; реального импорта, нарезки и аудиодвижка ещё нет.</text></g></svg>