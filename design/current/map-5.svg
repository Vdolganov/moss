<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-label="Графика и цвета"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#85878c"/></marker></defs><rect width="1240" height="800" fill="#191a1c"/><rect x="40" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">ORGANISM</text><text x="56" y="95" font-family="Arial" font-size="13" fill="#b9babf">Четыре полосы осцилляторов</text><text x="56" y="118" font-family="Arial" font-size="13" fill="#b9babf">Tension: связь · drift: диапазон · chaos: вариация</text><rect x="440" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">MONO</text><text x="456" y="95" font-family="Arial" font-size="13" fill="#b9babf">Частотная характеристика: логарифмическая ось</text><text x="456" y="118" font-family="Arial" font-size="13" fill="#b9babf">Cutoff / resonance + attack / release envelope</text><rect x="840" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">ORBIT</text><text x="856" y="95" font-family="Arial" font-size="13" fill="#b9babf">Импульсы на временной шкале</text><text x="856" y="118" font-family="Arial" font-size="13" fill="#b9babf">Time: интервал · feedback: спад · mix / spread</text><rect x="40" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">POND</text><text x="56" y="285" font-family="Arial" font-size="13" fill="#b9babf">Ранние отражения и хвост</text><text x="56" y="308" font-family="Arial" font-size="13" fill="#b9babf">Size: задержки · decay: длина · damping: HF спад</text><rect x="440" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">Движение</text><text x="456" y="285" font-family="Arial" font-size="13" fill="#b9babf">На STOP графика неподвижна</text><text x="456" y="308" font-family="Arial" font-size="13" fill="#b9babf">RUN: временной курсор; hidden / reduced motion стоп</text><rect x="840" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">Графитовая основа</text><text x="856" y="285" font-family="Arial" font-size="13" fill="#b9babf">Фон #191A1C · панель #222326</text><text x="856" y="308" font-family="Arial" font-size="13" fill="#b9babf">Текст #E8E8E6 · линии #414348</text><rect x="440" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">Четыре неизменных слота</text><text x="456" y="475" font-family="Arial" font-size="13" fill="#b9babf">Z #A7BA91 · X #91AEBB</text><text x="456" y="498" font-family="Arial" font-size="13" fill="#b9babf">C #ACA0BA · V #C69B83</text><rect x="40" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">CRUSH</text><text x="56" y="475" font-family="Arial" font-size="13" fill="#b9babf">Transfer: DRIVE / BITS / MIX</text><text x="56" y="498" font-family="Arial" font-size="13" fill="#b9babf">Тестовый сигнал: RATE sample hold</text></svg>