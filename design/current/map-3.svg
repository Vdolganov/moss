<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-label="TAPE и SAMPLER"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#85878c"/></marker></defs><rect width="1240" height="800" fill="#191a1c"/><path d="M400 100 H420 V100 H440" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M800 100 H820 V100 H840" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M1020 165 V195 H1020 V225" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="1020" y="187" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">Назначить явно</text><path d="M840 290 H820 V290 H800" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M440 290 H420 V290 H400" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M1020 355 V385 H1020 V415" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M840 480 H620 V480 H400" fill="none" stroke="#85878c" marker-end="url(#a)"/><rect x="40" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">TAPE / SOURCE</text><text x="56" y="95" font-family="Arial" font-size="13" fill="#b9babf">Resample track + SPACE / master · WAV import</text><text x="56" y="118" font-family="Arial" font-size="13" fill="#b9babf">Читаются заголовки WAV; нет декодирования</text><rect x="440" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">TAPE / EDIT</text><text x="456" y="95" font-family="Arial" font-size="13" fill="#b9babf">Один диапазон START–END при открытии</text><text x="456" y="118" font-family="Arial" font-size="13" fill="#b9babf">Нарезка только по SPLIT / + CUT из OPTIONS</text><rect x="840" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">Общая LIBRARY</text><text x="856" y="95" font-family="Arial" font-size="13" fill="#b9babf">SAVE создаёт независимые записи</text><text x="856" y="118" font-family="Arial" font-size="13" fill="#b9babf">Оригинал не меняется · ≤1 MiB PCM на asset</text><rect x="840" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">SAMPLER / клавиша</text><text x="856" y="285" font-family="Arial" font-size="13" fill="#b9babf">A: назначить asset · D-pad: выбрать клавишу</text><text x="856" y="308" font-family="Arial" font-size="13" fill="#b9babf">Z pitch · X start · C end · V level</text><rect x="440" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">Ручная область воспроизведения</text><text x="456" y="285" font-family="Arial" font-size="13" fill="#b9babf">START &lt; END · свои границы у каждой клавиши</text><text x="456" y="308" font-family="Arial" font-size="13" fill="#b9babf">Никакой автонарезки в SAMPLER</text><rect x="40" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">Учёт памяти</text><text x="56" y="285" font-family="Arial" font-size="13" fill="#b9babf">Один asset на нескольких клавишах = один PCM</text><text x="56" y="308" font-family="Arial" font-size="13" fill="#b9babf">8 MiB — предварительный бюджет UX</text><rect x="840" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">PATTERN / KEY</text><text x="856" y="475" font-family="Arial" font-size="13" fill="#b9babf">Z + стрелки: только назначенные доступные</text><text x="856" y="498" font-family="Arial" font-size="13" fill="#b9babf">Velocity / gate / probability · четыре locks</text><rect x="440" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">Сцены и перенос</text><text x="456" y="475" font-family="Arial" font-size="13" fill="#b9babf">Снимок содержит карты клавиш и паттерны</text><text x="456" y="498" font-family="Arial" font-size="13" fill="#b9babf">Библиотека общая · JSON включает assets</text><rect x="40" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">Пропавшее назначение</text><text x="56" y="475" font-family="Arial" font-size="13" fill="#b9babf">UNASSIGNED / MISSING FILE</text><text x="56" y="498" font-family="Arial" font-size="13" fill="#b9babf">Шаг не переназначается автоматически</text></svg>