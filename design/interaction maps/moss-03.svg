<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1170" role="img" aria-label="03 · Постоянные роли кнопок"><title>03 · Постоянные роли кнопок</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9589" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f4f4ed"/><path d="M780.0 120V150.0H280.0V180" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M780.0 120V150.0H780.0V180" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M780.0 120V150.0H1280.0V180" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M280.0 270V305.0H280.0V340" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M780.0 270V305.0H780.0V340" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M1280.0 270V305.0H1280.0V340" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M280.0 470V510.0H280.0V550" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M780.0 470V510.0H780.0V550" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M1280.0 470V510.0H1280.0V550" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1280.0" y="502.0" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">На устройстве нет Escape</text><path d="M280.0 675V717.5H280.0V760" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M780.0 675V717.5H780.0V760" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M1280.0 675V717.5H1280.0V760" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><g><rect x="540" y="40" width="480" height="80" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="558" y="68" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">УПРАВЛЕНИЕ MOSS</text><text x="558" y="93" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Объект → раздел → элемент → параметр</text></g><g><rect x="50" y="180" width="460" height="90" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="208" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">L1 / R1 · Q / E</text><text x="68" y="233" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Предыдущий / следующий объект</text></g><g><rect x="550" y="180" width="460" height="90" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="568" y="208" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">L2 / R2 · [ / ]</text><text x="568" y="233" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Предыдущая / следующая главная вкладка</text></g><g><rect x="1050" y="180" width="460" height="90" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1068" y="208" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">A / B / X / Y · Z / X / C / V</text><text x="1068" y="233" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Удержать + стрелки: параметр 1 / 2 / 3 / 4</text></g><g><rect x="50" y="340" width="460" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="368" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ОБЪЕКТ ВИДЕН НА ЭКРАНЕ</text><text x="68" y="393" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">ATLAS → проект · GRID / редактор → дорожка</text><text x="68" y="414" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">MIX LEVELS → дорожка · SCENES → сцена</text><text x="68" y="435" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">TAPE → сэмпл · MASTER FX → неактивно</text></g><g><rect x="550" y="340" width="460" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="568" y="368" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ОСНОВНАЯ СТРОКА ВКЛАДОК</text><text x="568" y="393" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">В проекте: GRID / MIX / TAPE</text><text x="568" y="414" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">В дорожке: PATTERN / VOICE / SPACE</text><text x="568" y="435" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">ATLAS: пара неактивна</text></g><g><rect x="1050" y="340" width="460" height="130" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1068" y="368" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ЗНАЧЕНИЕ МЕНЯЕТСЯ НА МЕСТЕ</text><text x="1068" y="393" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">← / → точно · ↑ / ↓ крупно</text><text x="1068" y="414" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Удержание стрелки ускоряет число</text><text x="1068" y="435" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Отпустить кнопку → один жест в Undo</text></g><g><rect x="50" y="550" width="460" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="578" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ВЫДЕЛИТЬ ≠ ПРИМЕНИТЬ</text><text x="68" y="603" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Выбор сцены не запускает её</text><text x="68" y="624" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Выбор проекта не открывает его</text><text x="68" y="645" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Выбор сэмпла не назначает его дорожке</text></g><g><rect x="550" y="550" width="460" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="568" y="578" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">D-PAD · ЛОКАЛЬНЫЙ ВЫБОР</text><text x="568" y="603" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Шаги, строки, действия, вторичные вкладки</text><text x="568" y="624" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Z / A коротко: подтвердить или триггер</text><text x="568" y="645" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">X / B коротко: назад на один уровень</text></g><g><rect x="1050" y="550" width="460" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1068" y="578" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">SELECT · ОТМЕНА / ATLAS</text><text x="1068" y="603" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Во время жеста: отменить весь жест</text><text x="1068" y="624" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">В меню: закрыть без применения</text><text x="1068" y="645" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">В обычном экране: проекты</text></g><g><rect x="50" y="760" width="460" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="788" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПАМЯТЬ ПОЗИЦИИ</text><text x="68" y="813" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Смена дорожки сохраняет VOICE / SPACE</text><text x="68" y="834" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Возврат в PATTERN сохраняет шаг и STEP / LOCKS</text><text x="68" y="855" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Курки на границе списка не зацикливаются</text></g><g><rect x="550" y="760" width="460" height="130" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="568" y="788" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">КОРОТКИЕ КОМАНДЫ</text><text x="568" y="813" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">C / X: шаг ↔ нижние поля в PATTERN</text><text x="568" y="834" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">V / Y: STEP ↔ LOCKS в PATTERN</text><text x="568" y="855" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">START / Space: воспроизведение / пауза</text></g><g><rect x="1050" y="760" width="460" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1068" y="788" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПРИОРИТЕТ ВВОДА</text><text x="1068" y="813" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Меню / ввод текста блокируют команды фона</text><text x="1068" y="834" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Активный жест фиксирует объект и параметр</text><text x="1068" y="855" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Потеря фокуса прекращает повтор стрелок</text></g><g><rect x="50" y="970" width="1460" height="130" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="998" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПОСТОЯННЫЕ ВИЗУАЛЬНЫЕ ОПОЗНАВАТЕЛИ</text><text x="68" y="1023" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">У параметров: Z шалфей · X голубой · C лаванда · V глина. Курки нейтральные.</text><text x="68" y="1044" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">L1/R1 стоят около имени объекта; L2/R2 — около главных вкладок.</text><text x="68" y="1065" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">При удержании подсвечиваются параметр и кнопка. Недоступные пары явно приглушены.</text></g></svg>