<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-label="Состояния и восстановление"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#85878c"/></marker></defs><rect width="1240" height="800" fill="#191a1c"/><path d="M800 100 H820 V100 H840" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M400 290 H420 V290 H440" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M800 290 H820 V290 H840" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="820" y="282" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">FINISH</text><path d="M440 290 H420 V290 H400" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="420" y="282" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">STAY</text><rect x="40" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">Пустой экран</text><text x="56" y="95" font-family="Arial" font-size="13" fill="#b9babf">Понятное действие создать / назначить</text><text x="56" y="118" font-family="Arial" font-size="13" fill="#b9babf">OPTIONS содержит команды; нет ложного триггера</text><rect x="440" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">Редактирование</text><text x="456" y="95" font-family="Arial" font-size="13" fill="#b9babf">Цвет только активного слота</text><text x="456" y="118" font-family="Arial" font-size="13" fill="#b9babf">Граница не вызывает короткое действие</text><rect x="840" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">Отмена</text><text x="856" y="95" font-family="Arial" font-size="13" fill="#b9babf">SELECT отменяет весь жест</text><text x="856" y="118" font-family="Arial" font-size="13" fill="#b9babf">OPTIONS → UNDO возвращает музыкальное изменение</text><rect x="40" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">CAPTURE</text><text x="56" y="285" font-family="Arial" font-size="13" fill="#b9babf">Источник и длина зафиксированы</text><text x="56" y="308" font-family="Arial" font-size="13" fill="#b9babf">FINISH / DISCARD остаются видимыми</text><rect x="440" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">Запрос выхода</text><text x="456" y="285" font-family="Arial" font-size="13" fill="#b9babf">STAY / FINISH / DISCARD</text><text x="456" y="308" font-family="Arial" font-size="13" fill="#b9babf">Выход сам не создаёт и не удаляет результат</text><rect x="840" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">Сохранение</text><text x="856" y="285" font-family="Arial" font-size="13" fill="#b9babf">Черновик EDIT сохраняется при перезагрузке</text><text x="856" y="308" font-family="Arial" font-size="13" fill="#b9babf">Ошибка локального сохранения → экспорт</text><rect x="40" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">Выбор сцены</text><text x="56" y="475" font-family="Arial" font-size="13" fill="#b9babf">L1/R1: только выделение</text><text x="56" y="498" font-family="Arial" font-size="13" fill="#b9babf">A: применить / очередь; STOP отменяет очередь</text><rect x="440" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">Сэмпл недоступен / превышение</text><text x="456" y="475" font-family="Arial" font-size="13" fill="#b9babf">Показать причину и путь в TAPE / VOICE</text><text x="456" y="498" font-family="Arial" font-size="13" fill="#b9babf">Нельзя молча подставить соседний файл</text><rect x="840" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">Фокус после меню</text><text x="856" y="475" font-family="Arial" font-size="13" fill="#b9babf">Возврат к инициатору / ближайшему объекту</text><text x="856" y="498" font-family="Arial" font-size="13" fill="#b9babf">Открытие OPTIONS не меняет выбранный объект</text></svg>