<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1190" role="img" aria-label="03 · Короткие сэмплы и RAM"><title>03 · Короткие сэмплы и RAM</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9589" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f4f4ed"/><path d="M490 115.0H525.0V115.0H560" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M1000 115.0H1035.0V115.0H1070" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M490 402.5H525.0V402.5H560" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M1000 402.5H1035.0V402.5H1070" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1035.0" y="392.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Да</text><path d="M780.0 465V537.5H780.0V610" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="780.0" y="529.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Превышение</text><path d="M1290.0 465V537.5H1290.0V610" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><g><rect x="50" y="60" width="440" height="110" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ДЛИННЫЙ ИСХОДНИК НА SD</text><text x="68" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Пример: 60 s / 44.1 kHz / PCM16</text><text x="68" y="134" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Mono ≈ 5.05 MiB · stereo ≈ 10.09 MiB</text></g><g><rect x="560" y="60" width="440" height="110" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="578" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПОДГОТОВКА БЛОКАМИ</text><text x="578" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Чтение / декодирование / запись</text><text x="578" y="134" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Уменьшенная волновая форма</text><text x="578" y="155" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Без полного исходника в RAM</text></g><g><rect x="1070" y="60" width="440" height="110" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1088" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">КОРОТКИЕ ASSETS НА SD</text><text x="1088" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Физически отдельные файлы</text><text x="1088" y="134" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Проверить размер каждого фрагмента</text><text x="1088" y="155" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Исходный файл сохраняется</text></g><g><rect x="50" y="340" width="440" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="368" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">КАРТЫ КЛАВИШ И ПАТТЕРНЫ</text><text x="68" y="393" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Какие assets потребуются для воспроизведения</text><text x="68" y="414" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Несколько назначений одного файла</text><text x="68" y="435" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">считаются одним asset</text></g><g><rect x="560" y="340" width="440" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="578" y="368" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПРОВЕРИТЬ ПИК ПАМЯТИ</text><text x="578" y="393" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Активный + подготавливаемый набор</text><text x="578" y="414" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Звучащие голоса удерживают свои файлы</text><text x="578" y="435" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Рабочие буферы и FX учесть отдельно</text></g><g><rect x="1070" y="340" width="440" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1088" y="368" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПОДГОТОВИТЬ PCM-КЭШ</text><text x="1088" y="393" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Прочитать уникальные assets заранее</text><text x="1088" y="414" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Общий буфер, отдельные позиции голосов</text><text x="1088" y="435" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Не ждать SD в момент триггера</text></g><g><rect x="560" y="610" width="440" height="125" rx="3" fill="#f2e8e1" stroke="#b18d77" /><text x="578" y="638" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">НЕ ПОМЕЩАЕТСЯ</text><text x="578" y="663" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Показать нужный и доступный объём</text><text x="578" y="684" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Укоротить / нарезать / сократить набор</text><text x="578" y="705" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Либо остановить и загрузить новую сцену</text></g><g><rect x="1070" y="610" width="440" height="125" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1088" y="638" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">READY → ВОСПРОИЗВЕДЕНИЕ</text><text x="1088" y="663" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Шаг выбирает только назначенную KEY</text><text x="1088" y="684" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Смена сцены ждёт подготовки её assets</text><text x="1088" y="705" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Не выгружать звучащие данные</text></g><g><rect x="50" y="610" width="440" height="125" rx="3" fill="#f2e8e1" stroke="#b18d77" /><text x="68" y="638" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ТЕСТОВЫЙ БЮДЖЕТ UI</text><text x="68" y="663" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Кэш PCM: 8 MiB · asset: до 1 MiB</text><text x="68" y="684" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Числа предварительные</text><text x="68" y="705" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Проверить реальную RAM и SD на устройстве</text></g><g><rect x="50" y="900" width="1460" height="140" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="928" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">РАСЧЁТ И ИНДИКАЦИЯ</text><text x="68" y="953" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">RAM PCM = число кадров × каналы × байты на канал. Float32 занимает вдвое больше int16.</text><text x="68" y="974" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">10 секунд PCM16 / 44.1 kHz: mono ≈ 0.84 MiB, stereo ≈ 1.68 MiB.</text><text x="68" y="995" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Показывать SD и RAM отдельно. Подрезка назначения не уменьшает целиком загружаемый asset.</text></g></svg>