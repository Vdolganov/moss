<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1190" role="img" aria-label="05 · Сцены и область снимка"><title>05 · Сцены и область снимка</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9589" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f4f4ed"/><path d="M470 107.5H520.0V107.5H570" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M990 107.5H1040.0V115.0H1090" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M780.0 370V420.0H260.0V470" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="520.0" y="412.0" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">A при STOP</text><path d="M780.0 370V420.0H1300.0V470" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1040.0" y="412.0" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">A при RUN</text><path d="M260.0 570V645.0H780.0V720" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M1300.0 570V645.0H1300.0V720" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M1090 787.5H1040.0V787.5H990" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M570 787.5H520.0V787.5H470" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="520.0" y="777.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Сохраняются</text><g><rect x="50" y="60" width="420" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ТЕКУЩЕЕ СОСТОЯНИЕ</text><text x="68" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Паттерны · инструменты · FX · микшер</text></g><g><rect x="570" y="60" width="420" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="588" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">SAVE HERE / OVERWRITE</text><text x="588" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Один из 4 слотов · имя</text><text x="588" y="134" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Перезапись с подтверждением</text></g><g><rect x="1090" y="60" width="420" height="110" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1108" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">СНИМОК СЦЕНЫ</text><text x="1108" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Все tracks целиком + BPM + master FX</text><text x="1108" y="134" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Активный паттерн + длина</text></g><g><rect x="570" y="270" width="420" height="100" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="588" y="298" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ВЫБРАТЬ СЦЕНУ</text><text x="588" y="323" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Предложение: L1/R1 выделяют слот</text><text x="588" y="344" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Применение только по A</text></g><g><rect x="50" y="470" width="420" height="100" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="498" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ТРАНСПОРТ ОСТАНОВЛЕН</text><text x="68" y="523" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Применить снимок сразу</text></g><g><rect x="1090" y="470" width="420" height="100" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1108" y="498" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ТРАНСПОРТ ИДЁТ</text><text x="1108" y="523" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Поставить сцену в очередь NEXT LOOP</text><text x="1108" y="544" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Повторный выбор убирает её из очереди</text></g><g><rect x="570" y="720" width="420" height="135" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="588" y="748" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ВОССТАНОВИТЬ СЦЕНУ</text><text x="588" y="773" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Состав, имена, инструменты, все паттерны</text><text x="588" y="794" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Дорожечные FX, уровни и mute / solo</text><text x="588" y="815" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">BPM, master FX, выбранный паттерн, длина</text></g><g><rect x="1090" y="720" width="420" height="135" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1108" y="748" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">НАЧАЛО ЦИКЛА</text><text x="1108" y="773" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Применить, если нет жеста / меню</text><text x="1108" y="794" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Позиция воспроизведения → начало</text></g><g><rect x="50" y="720" width="420" height="135" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="748" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ЧТО ОСТАЁТСЯ В ПРОЕКТЕ</text><text x="68" y="773" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Память TAPE и настройки capture</text><text x="68" y="794" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Название проекта и тональность</text><text x="68" y="815" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Сами слоты сцен</text></g><g><rect x="50" y="960" width="700" height="150" rx="3" fill="#f2e8e1" stroke="#b18d77" /><text x="68" y="988" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">НУЖНО УТОЧНИТЬ: ЧТО ТАКОЕ СЦЕНА</text><text x="68" y="1013" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Сейчас сцена может вернуть удалённую дорожку,</text><text x="68" y="1034" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">старое имя или прежние паттерны.</text><text x="68" y="1055" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Рекомендуется явно выбрать: полный снимок</text><text x="68" y="1076" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">или только вариация звучания.</text></g><g><rect x="800" y="960" width="710" height="150" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="818" y="988" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">НУЖНО УТОЧНИТЬ: STOP ПРИ NEXT LOOP</text><text x="818" y="1013" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Сейчас остановка немедленно применяет очередь.</text><text x="818" y="1034" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Предлагается: STOP отменяет очередь,</text><text x="818" y="1055" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">активная сцена остаётся прежней;</text><text x="818" y="1076" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">применить другую можно отдельным нажатием A.</text></g></svg>