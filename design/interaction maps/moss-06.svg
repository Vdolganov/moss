<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1100" role="img" aria-label="06 · SLOW SIGNAL: полный маршрут"><title>06 · SLOW SIGNAL: полный маршрут</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9589" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f4f4ed"/><path d="M470 112.5H520.0V112.5H570" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M990 112.5H1040.0V112.5H1090" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M1300.0 165V237.5H1300.0V310" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M1090 362.5H1040.0V362.5H990" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M570 362.5H520.0V362.5H470" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M260.0 415V487.5H260.0V560" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M470 617.5H520.0V617.5H570" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M990 617.5H1040.0V617.5H1090" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M1300.0 675V772.5H780.0V870" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><g><rect x="50" y="60" width="420" height="105" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">1 · ПУСТОЙ ПРОЕКТ</text><text x="68" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">ATLAS → NEW PROJECT → SLOW SIGNAL</text><text x="68" y="134" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">BPM 70 · G MINOR · длина 64</text></g><g><rect x="570" y="60" width="420" height="105" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="588" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">2 · DRONE / ORGANISM</text><text x="588" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Добавить дорожку · шаг 01 ON</text><text x="588" y="134" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Note G2 · gate 64</text><text x="588" y="155" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Настроить 4 параметра VOICE</text></g><g><rect x="1090" y="60" width="420" height="105" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1108" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">3 · PULSE / MONO</text><text x="1108" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Добавить MONO</text><text x="1108" y="134" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Шаги 01, 21, 45, 61</text><text x="1108" y="155" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Редактировать ноты и probability</text></g><g><rect x="1090" y="310" width="420" height="105" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1108" y="338" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">4 · LOCK НА ШАГЕ 45</text><text x="1108" y="363" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">PATTERN → шаг 45 → LOCKS</text><text x="1108" y="384" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Z + стрелки: cutoff 1400</text><text x="1108" y="405" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Проверить соседний шаг</text></g><g><rect x="570" y="310" width="420" height="105" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="588" y="338" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">5 · SPACE И MIX</text><text x="588" y="363" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Эффект PULSE → FX ON</text><text x="588" y="384" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">MIX: уровни трёх дорожек позже</text><text x="588" y="405" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">MASTER FX: общий эффект</text></g><g><rect x="50" y="310" width="420" height="105" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="338" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">6 · ЗАХВАТ DRONE</text><text x="68" y="363" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">TAPE → Z: DRONE · X: 4 такта</text><text x="68" y="384" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">CAPTURE → FINISH / таймер</text><text x="68" y="405" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Проверить, что DRONE остался ORGANISM</text></g><g><rect x="50" y="560" width="420" height="115" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="588" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">7 · DUST / SAMPLER</text><text x="68" y="613" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Добавить третью дорожку</text><text x="68" y="634" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">TAPE → ASSIGN TO TRACK → DUST</text><text x="68" y="655" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Настроить pitch, speed и слайсы</text></g><g><rect x="570" y="560" width="420" height="115" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="588" y="588" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">8 · ПАТТЕРН ТЕКСТУРЫ</text><text x="588" y="613" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Шаги 09, 33, 53: gate 8, probability 65</text><text x="588" y="634" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Проверить три дорожки через L1/R1</text><text x="588" y="655" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Целевая навигация — пока предложение</text></g><g><rect x="1090" y="560" width="420" height="115" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1108" y="588" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">9 · ДВЕ СЦЕНЫ</text><text x="1108" y="613" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">MIX → SCENES: сохранить ARRIVAL</text><text x="1108" y="634" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Изменить VOICE / FX / MIX</text><text x="1108" y="655" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Сохранить BLOOM; сравнить сцены</text></g><g><rect x="50" y="870" width="1460" height="130" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="898" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">10 · СОХРАНИТЬ И ВЕРНУТЬСЯ</text><text x="68" y="923" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Экспортировать JSON · вернуться в ATLAS · открыть проект снова</text><text x="68" y="944" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Проверить: 3 дорожки, 64 шага, lock на 45, сэмпл в памяти и две сцены</text><text x="68" y="965" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Это сценарий проверки, а не отчёт о прохождении пользователем</text></g></svg>