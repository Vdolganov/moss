<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-label="Кнопки и приоритет"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#85878c"/></marker></defs><rect width="1240" height="800" fill="#191a1c"/><path d="M400 480 H420 V480 H440" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="420" y="472" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">Если не ввод</text><path d="M800 480 H820 V480 H840" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="820" y="472" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">Если не жест</text><rect x="40" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">L1/R1 · Q/E</text><text x="56" y="95" font-family="Arial" font-size="13" fill="#b9babf">Предыдущий / следующий видимый объект</text><text x="56" y="118" font-family="Arial" font-size="13" fill="#b9babf">Проект, дорожка, сцена, слайс, файл</text><rect x="440" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">L2/R2 · [ / ]</text><text x="456" y="95" font-family="Arial" font-size="13" fill="#b9babf">Основные вкладки текущего уровня</text><text x="456" y="118" font-family="Arial" font-size="13" fill="#b9babf">GRID/MIX/TAPE или PATTERN/VOICE/SPACE</text><rect x="840" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">L1+R1 · Q+E</text><text x="856" y="95" font-family="Arial" font-size="13" fill="#b9babf">Опции текущего экрана</text><text x="856" y="118" font-family="Arial" font-size="13" fill="#b9babf">Одиночное переключение только при отпускании</text><rect x="40" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">A/B/X/Y · Z/X/C/V</text><text x="56" y="285" font-family="Arial" font-size="13" fill="#b9babf">Удержать слот + стрелки: изменить значение</text><text x="56" y="308" font-family="Arial" font-size="13" fill="#b9babf">Отпустить: один Undo · SELECT: отменить</text><rect x="440" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">D-pad / короткие нажатия</text><text x="456" y="285" font-family="Arial" font-size="13" fill="#b9babf">A: действие · B: назад · V: вторичная вкладка</text><text x="456" y="308" font-family="Arial" font-size="13" fill="#b9babf">C: шаг / поля · START: транспорт</text><rect x="840" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">Границы и недоступность</text><text x="856" y="285" font-family="Arial" font-size="13" fill="#b9babf">Объекты не зацикливаются</text><text x="856" y="308" font-family="Arial" font-size="13" fill="#b9babf">MASTER FX и TAPE SOURCE: L1/R1 неактивны</text><rect x="40" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">1. Ввод / меню</text><text x="56" y="475" font-family="Arial" font-size="13" fill="#b9babf">Текст принадлежит полю</text><text x="56" y="498" font-family="Arial" font-size="13" fill="#b9babf">Меню удерживает фокус; B/SELECT закрывает</text><rect x="440" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">2. Жест параметра</text><text x="456" y="475" font-family="Arial" font-size="13" fill="#b9babf">Зафиксированы цель и слот</text><text x="456" y="498" font-family="Arial" font-size="13" fill="#b9babf">Курки заблокированы · blur завершает жест</text><rect x="840" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">3. Навигация</text><text x="856" y="475" font-family="Arial" font-size="13" fill="#b9babf">Сначала политика выхода из CAPTURE</text><text x="856" y="498" font-family="Arial" font-size="13" fill="#b9babf">Затем смена экрана без изменения музыки</text></svg>