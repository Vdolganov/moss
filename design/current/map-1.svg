<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-label="Структура"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#85878c"/></marker></defs><rect width="1240" height="800" fill="#191a1c"/><g aria-label="Области проекта и дорожки"><rect x="20" y="190" width="1200" height="180" fill="none" stroke="#414348"/><text x="40" y="214" fill="#b9babf" font-family="Arial" font-size="12">ОТКРЫТЫЙ ПРОЕКТ · GRID / MIX / TAPE</text><rect x="20" y="380" width="1200" height="180" fill="none" stroke="#414348"/><text x="40" y="404" fill="#b9babf" font-family="Arial" font-size="12">РЕДАКТОР ВЫБРАННОЙ ДОРОЖКИ · PATTERN / VOICE / SPACE</text></g><path d="M620 165 V195 H220 V225" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="420" y="187" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">Открыть проект</text><path d="M620 165 V195 H620 V225" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M620 165 V195 H1020 V225" fill="none" stroke="#85878c" marker-end="url(#a)"/><path d="M220 355 V385 H220 V415" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="220" y="377" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">Открыть дорожку</text><path d="M400 480 H420 V480 H440" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="420" y="472" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">L2/R2</text><path d="M800 480 H820 V480 H840" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="820" y="472" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">L2/R2</text><path d="M620 545 V575 H620 V605" fill="none" stroke="#85878c" marker-end="url(#a)"/><text x="620" y="567" fill="#b9babf" font-family="Arial" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#191a1c" stroke-width="4">B</text><rect x="440" y="35" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="65" font-family="Arial" font-size="17" fill="#e8e8e6">ATLAS · проекты</text><text x="456" y="95" font-family="Arial" font-size="13" fill="#b9babf">L1/R1: выбрать проект</text><text x="456" y="118" font-family="Arial" font-size="13" fill="#b9babf">A: открыть · OPTIONS: создать / импорт</text><rect x="40" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">GRID</text><text x="56" y="285" font-family="Arial" font-size="13" fill="#b9babf">Обзор дорожек: имя / VOICE / SPACE</text><text x="56" y="308" font-family="Arial" font-size="13" fill="#b9babf">A: открыть редактор · OPTIONS: добавить</text><rect x="440" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">MIX</text><text x="456" y="285" font-family="Arial" font-size="13" fill="#b9babf">V: LEVELS / MASTER FX / SCENES</text><text x="456" y="308" font-family="Arial" font-size="13" fill="#b9babf">Уровни, общая обработка, снимки</text><rect x="840" y="225" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="255" font-family="Arial" font-size="17" fill="#e8e8e6">TAPE</text><text x="856" y="285" font-family="Arial" font-size="13" fill="#b9babf">V: SOURCE / EDIT / LIBRARY</text><text x="856" y="308" font-family="Arial" font-size="13" fill="#b9babf">Подготовка материала для SAMPLER</text><rect x="40" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="56" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">PATTERN</text><text x="56" y="475" font-family="Arial" font-size="13" fill="#b9babf">Цикл дорожки 1–64 · 16 / 32 / 64</text><text x="56" y="498" font-family="Arial" font-size="13" fill="#b9babf">STEP / VOICE LOCKS / FX LOCKS / CYCLE</text><rect x="440" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">VOICE</text><text x="456" y="475" font-family="Arial" font-size="13" fill="#b9babf">ORGANISM / MONO / SAMPLER</text><text x="456" y="498" font-family="Arial" font-size="13" fill="#b9babf">Четыре параметра и модель их действия</text><rect x="840" y="415" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="856" y="445" font-family="Arial" font-size="17" fill="#e8e8e6">SPACE</text><text x="856" y="475" font-family="Arial" font-size="13" fill="#b9babf">Эффект только этой дорожки</text><text x="856" y="498" font-family="Arial" font-size="13" fill="#b9babf">ORBIT / POND / CRUSH · тип и bypass в OPTIONS</text><rect x="440" y="605" width="360" height="130" fill="#222326" stroke="#55575c"/><text x="456" y="635" font-family="Arial" font-size="17" fill="#e8e8e6">Возврат и память позиции</text><text x="456" y="665" font-family="Arial" font-size="13" fill="#b9babf">B: редактор → GRID → ATLAS</text><text x="456" y="688" font-family="Arial" font-size="13" fill="#b9babf">SELECT: отменить жест / меню; иначе ATLAS</text></svg>