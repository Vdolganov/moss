<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1100" role="img" aria-label="04 · Ресэмплинг и возврат"><title>04 · Ресэмплинг и возврат</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9589" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f4f4ed"/><path d="M470 107.5H520.0V107.5H570" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M990 107.5H1040.0V107.5H1090" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M1300.0 155V207.5H1300.0V260" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1300.0" y="199.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Отмена</text><path d="M1090 107.5H1040.0V307.5H990" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1040.0" y="197.5" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Сохранить</text><path d="M570 307.5H520.0V315.0H470" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M260.0 370V415.0H260.0V460" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M470 507.5H520.0V507.5H570" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M990 507.5H1040.0V520.0H1090" fill="none" stroke="#8b9589" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1040.0" y="503.75" text-anchor="middle" fill="#4d594c" font-family="Arial, sans-serif" font-size="13" paint-order="stroke" stroke="#f4f4ed" stroke-width="5" stroke-linejoin="round">Хранение</text><path d="M470 760.0H520.0V760.0H570" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M990 760.0H1040.0V760.0H1090" fill="none" stroke="#8b9589" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><g><rect x="50" y="60" width="420" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">TAPE · SOURCE</text><text x="68" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Z + стрелки: MASTER или дорожка</text></g><g><rect x="570" y="60" width="420" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="588" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">LENGTH</text><text x="588" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">X + стрелки: 1–8 тактов</text></g><g><rect x="1090" y="60" width="420" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1108" y="88" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">CAPTURE</text><text x="1108" y="113" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Таймер · прогресс</text><text x="1108" y="134" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Источник и длина заблокированы</text></g><g><rect x="1090" y="260" width="420" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1108" y="288" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">CANCEL</text><text x="1108" y="313" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Закончить без нового сэмпла</text></g><g><rect x="570" y="260" width="420" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="588" y="288" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">FINISH / ИСТЁК ТАЙМЕР</text><text x="588" y="313" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Создать визуальный сэмпл в памяти</text></g><g><rect x="50" y="260" width="420" height="110" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="288" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">SAMPLE MEMORY</text><text x="68" y="313" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Сэмпл выбран · источник и длительность</text><text x="68" y="334" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Исходная дорожка сохранена</text></g><g><rect x="50" y="460" width="420" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="68" y="488" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ASSIGN TO TRACK</text><text x="68" y="513" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Явно выбрать дорожку назначения</text></g><g><rect x="570" y="460" width="420" height="95" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="588" y="488" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">VOICE → SAMPLER</text><text x="588" y="513" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Копия сэмпла назначена</text><text x="588" y="534" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Pitch / speed / slices / slice</text></g><g><rect x="1090" y="460" width="420" height="120" rx="3" fill="#f8f9f4" stroke="#889486" /><text x="1108" y="488" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПАМЯТЬ ПРОЕКТА</text><text x="1108" y="513" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Переименовать · удалить из памяти</text><text x="1108" y="534" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Назначенные копии остаются</text><text x="1108" y="555" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Экспорт JSON включает память</text></g><g><rect x="50" y="710" width="420" height="100" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="68" y="738" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ВЫХОД ВО ВРЕМЯ CAPTURE</text><text x="68" y="763" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">B / SELECT / вкладки / смена проекта</text></g><g><rect x="570" y="710" width="420" height="100" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="588" y="738" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПОКАЗАТЬ ВЫБОР</text><text x="588" y="763" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Остаться · закончить и сохранить</text><text x="588" y="784" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Отменить захват и выйти</text></g><g><rect x="1090" y="710" width="420" height="100" rx="3" fill="#edf1e9" stroke="#879775" stroke-dasharray="6 4"/><text x="1108" y="738" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">ПРОДОЛЖИТЬ ПЕРЕХОД</text><text x="1108" y="763" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Только после сохранения или отмены</text><text x="1108" y="784" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Сэмпл принадлежит исходному проекту</text></g><g><rect x="50" y="900" width="1460" height="130" rx="3" fill="#f2e8e1" stroke="#b18d77" /><text x="68" y="928" fill="#263124" font-family="Arial, sans-serif" font-size="18" font-weight="600">СЕЙЧАС ЕСТЬ РАЗРЫВ СЦЕНАРИЯ</text><text x="68" y="953" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Таймер работает вне TAPE, включая ATLAS; открытие проекта сбрасывает захват.</text><text x="68" y="974" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">В коде есть projectId захвата, но finishCapture сохраняет через текущий p().</text><text x="68" y="995" fill="#4b5647" font-family="Arial, sans-serif" font-size="15">Нужны явный выход и привязка результата к проекту; автоматического сохранения аудио нет.</text></g></svg>